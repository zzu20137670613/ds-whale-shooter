# Seed — the upstream machine gun, back on the roster: rapid fire, a big
# magazine, a short reload. Restored from b9d349c with its numbers unchanged,
# minus the unread `bullet.speed` the schema no longer accepts.
name: Assault Rifle
nameZh: "突击步枪"
damage: 4
cooldownMs: 100
range: 550
upgrades:
    # Tavern weapon ladder. `costs.length` IS the max level.
    costs: [40, 90, 160, 250, 360]
    damageMulPerLevel: 1.15
clipSize: 35
reloadTimeMs: 1500
bulletsPerShot: 1
visual:
    texture: assets/image/weapons/assault-rifle.png
    scale: 0.16
    orbitRadius: 18
    anchor: [0.45, 0.5]
    recoilDistance: 6
    recoilDuration: 80
bullet:
    texture: assets/image/weapons/assault-bullet.png
    type: projectile
    scale: 0.08
    anchor: [0.5, 0.5]
    spawnOffset: [10, -10]
projectile:
    speed: 24
    visual:
        radius: 4
        width: 2
        height: 2
        color: 0x23C9D0
sfx:
    shoot: assault-rifle-shoot
    dryFire: dry-fire
    bulletWall: bullet-wall
    reloadStart: reload-start
    reloadFinish: reload-finish
