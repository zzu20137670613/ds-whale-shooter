# Qwen — a paper charm that holds the room still. Her shot is arcana-staff's:
# one cyan orb per press, not a spread. Damage / cooldown / range / AoE are
# still hers; only the projectile is borrowed.
# PLACEHOLDER ART — reuses the rune-shield.png sprite for the charm in her
# hand until Exorcism Talisman art exists.
name: Exorcism Talisman
nameZh: "灭妖符"
damage: 20
cooldownMs: 900
range: 600
aoeRadius: 70
upgrades:
    # Tavern weapon ladder. `costs.length` IS the max level.
    costs: [42, 94, 164, 254, 368]
    damageMulPerLevel: 1.14
clipSize: 9
reloadTimeMs: 2600
visual:
    texture: assets/image/weapons/rune-shield.png
    scale: 0.16
    orbitRadius: 20
    anchor: [0.3, 0.5]
    recoilDistance: 10
    recoilDuration: 140
bullet:
    texture: assets/image/weapons/arcana-orb.png
    type: projectile
    scale: 0.08
    anchor: [0.5, 0.5]
projectile:
    speed: 16
    visual:
        radius: 8
        width: 8
        height: 8
        color: 0x23C9D0
sfx:
    shoot: arcana-staff-shoot