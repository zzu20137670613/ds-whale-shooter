name: Whale Cannon
nameZh: "鲸娘重炮"
damage: 50
aoeRadius: 75
# 主人：`第一发炮弹如果打到了怪物，炮弹原地炸开，0.1秒后在原处形成一个红色的天谴轰炸圈`。
secondaryBlastMs: 100
# 主人：`二次圈半径120吧，凑整好维护`（首发 AoE 是 75）。
secondaryBlastRadius: 120
cooldownMs: 1100
range: 760
upgrades:
    # Tavern weapon ladder. `costs.length` IS the max level.
    costs: [40, 90, 160, 250, 360]
    damagePerLevel: [50, 57, 66, 76, 88, 100]
clipSize: 5
ammoPrice: { price: 2, perRounds: 1 }
reloadTimeMs: 2600
bulletsPerShot: 1
# PLACEHOLDER ASSET — reuses the rocket-launcher / rocket-missile
# sprites until whale-themed weapon art exists.
visual:
    texture: assets/image/weapons/rocket-launcher.png
    scale: 0.18
    orbitRadius: 22
    anchor: [0.45, 0.5]
    recoilDistance: 13
    recoilDuration: 150
bullet:
    texture: assets/image/weapons/rocket-missile.png
    type: projectile
    scale: 0.13
    anchor: [0.5, 0.5]
projectile:
    speed: 17
    visual:
        radius: 7
        width: 26
        height: 9
        color: 0x2A6FA8
sfx:
    shoot: rocket-launcher-shoot
    dryFire: dry-fire
    bulletWall: bullet-wall
    reloadStart: reload-start
    reloadFinish: reload-finish
