name: Whale Minigun
nameZh: "鲸娘机枪"
damage: 3
cooldownMs: 70
range: 480
upgrades:
    # Tavern weapon ladder. `costs.length` IS the max level.
    costs: [40, 90, 160, 250, 360]
    damageMulPerLevel: 1.15
clipSize: 45
reloadTimeMs: 2200
bulletsPerShot: 1
# PLACEHOLDER ASSET — reuses the assault-rifle / assault-bullet sprites
# until whale-themed weapon art exists. Texture paths are data, so
# swapping them later touches no code.
visual:
    texture: assets/image/weapons/assault-rifle.png
    scale: 0.16
    orbitRadius: 18
    anchor: [0.45, 0.5]
    recoilDistance: 5
    recoilDuration: 60
bullet:
    texture: assets/image/weapons/assault-bullet.png
    type: projectile
    speed: 760
    scale: 0.07
    anchor: [0.5, 0.5]
    spawnOffset: [10, -10]
projectile:
    speed: 26
    visual:
        radius: 4
        width: 2
        height: 2
        color: 0x2E8FB5
sfx:
    shoot: assault-rifle-shoot
    dryFire: dry-fire
    bulletWall: bullet-wall
    reloadStart: reload-start
    reloadFinish: reload-finish
