# GPT — rapid fire, because she cannot take a hit.
# ART: its own rifle now - white dragon plating, blue-lit magazine, a bayonet under the barrel.
# The source is 2740x796 with alpha; cropped, mirrored so the muzzle points right like every
# other held gun, and resized to 1000px so the texture stays in the same weight class.
# The BULLET still borrows assault-bullet.png - that is the projectile, not the 立绘.
name: White Dragon Fangs
nameZh: "白龙獠牙"
# 主人 2026-11-14：`紫色光柱配给白龙獠牙（天空城踩龙王王座给的枪上加这个特效）`。
# 它落在王座上的那一刻，地上一道紫色光柱把它框起来。
beam: violet
damage: 25
cooldownMs: 167
range: 560
upgrades:
    # Tavern weapon ladder. `costs.length` IS the max level.
    costs: [36, 80, 140, 220, 320]
    damagePerLevel: [25, 30, 30, 35, 40, 45]
clipSize: 25
ammoPrice: { price: 1, perRounds: 3 }
reloadTimeMs: 1800
bulletsPerShot: 2
visual:
    texture: assets/image/weapons/white-dragon-fangs.png
    # 1000px art x 0.16 = ~160px in her hands, a shade longer than the cat's rifle.
    scale: 0.16
    orbitRadius: 16
    # The grip sits at ~28% from the left after the mirror.
    anchor: [0.28, 0.55]
    recoilDistance: 5
    recoilDuration: 60
bullet:
    texture: assets/image/weapons/assault-bullet.png
    type: projectile
    scale: 0.13
    anchor: [0.5, 0.5]
projectile:
    speed: 22
    visual:
        radius: 5
        width: 18
        height: 6
        color: 0xEDF3FF
