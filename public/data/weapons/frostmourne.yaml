# Seed — the sword from the original game, renamed for the joke. Melee: no
# bullet count (see docs/WEAPONS.md).
# ART IS REAL — plasma-sword.png / plasma-slash-arc.png are the upstream sword
# sprites, the same pair the retired plasma-sword.yaml used.
# Numbers are that retired sword's (damage 22 / 400ms / reach 180) and are
# placeholders: the whole ladder gets re-tuned in the numeric pass.
name: Frostmourne
nameZh: "霜之哀伤"
damage: 22
cooldownMs: 400
range: 180
upgrades:
    # Tavern weapon ladder. `costs.length` IS the max level.
    costs: [40, 90, 160, 250, 360]
    damageMulPerLevel: 1.15
hitWidth: 120
hitHeight: 120
visual:
    texture: assets/image/weapons/plasma-sword.png
    scale: 0.16
    orbitRadius: 10
    anchor: [0.1, 0.5]
    swingAngle: 200
    rotationOffset: 0
bullet:
    texture: assets/image/weapons/plasma-slash-arc.png
    type: melee
    scale: 0.35
    anchor: [0.5, 0.5]
    rotationOffset: 0
sfx:
    shoot: plasma-sword-shoot