characterSpawn:
    x: 3700
    'y': 1600
    facing: right

monsters: []
spawner:
    # 单块 5504x3072 内部分成 2x2 象限，玩家第一次踏入某个象限刷一波。
    # 波数沿用图书馆：入口 1 / 第二关 2 / 第三关 2 / 第四关 3。每次进入都重刷。
    delayMs: 2000
    waves: 1
    near: { count: 4, minDistance: 300, maxDistance: 900 }
    far: { count: 5, edgeInset: 480 }
    exclude:
        # 从旧 4x4 spawner 搬来的禁刷矩形（本地坐标）：屋顶、王座高台、
        # 以及海边那条窄条，都是美术上不可站人的地方。
        - { x: 0, y: 0, width: 720, height: 3072 }
    pool:
        melee: [keeper]
        ranged: [drone-ultra]

dropSpawns: []
materials: []

teleporters:
    # 位置来自主人的绿圈，半径统一 200（2x2 规则）。
    - id: to-library
      x: 1688
      'y': 489
      targetScene: starry-library-4-scroll
      targetPortalId: to-sky-city
      radius: 200
    - id: to-moon-bridge
      x: 5259
      'y': 1577
      targetScene: gpt-sky-city-2-moon-bridge
      targetPortalId: from-entrance
      radius: 200
