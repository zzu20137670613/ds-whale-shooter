# 碰撞墙来自主人 2026-11-11 的按块标注（红=不可达），128px 网格合并成矩形。
background: assets/image/scenes/gpt-sky-city/sky-city-1-landing.png
imageSize: 5504x3072
# 旧 4x4 版这张图就是 pixelLighting: false（差分光效会把画面压暗，
# 主人报过「月桥色调明显偏暗」）；拆开后每块都要带上这一行。
pixelLighting: false
# 天空之城底图偏亮，词元盾光柱改用深色（主人 2026-11-12）。
