characterSpawn:
    x: 2960
    'y': 1520
    facing: right

monsters: []
spawner:
    # 单块 5504x3072 内部再四等分成 2x2 象限，玩家第一次踏入某个象限时刷一波。
    # 波次：入口 1 / 柜台 2 / 露台 2 / 卷轴 3。每次进入都重新刷（不再读存档）。
    delayMs: 2000
    waves: 1
    near: { count: 4, minDistance: 300, maxDistance: 900 }
    far: { count: 5, edgeInset: 420 }
    exclude:
        # 主人 2026-11-13：`星空图书馆入口关有怪刷到右上角了，将这个角落刷怪禁掉，只让刷到其他位置`。
        # 右上角那片是星空（断掉的木梁 + 会飞的纸页），底图下面没有地板，怪会悬在星星中间。
        # 世界坐标从底图上量：天空楔形占 x 3400-5504 / y 0-1300，禁掉整块后远处的
        # 5 个刷怪点会落到 y≈1324 的实地上（东侧书架前那块地板）。
        - { x: 3400, y: 0, width: 2104, height: 1300 }
    # 血量倍数：拆分后按关卡重调，等主人给数值。
    pool:
        melee: [drone]     # 星穹潜行者
        ranged: [sniper]   # 星海狙手

dropSpawns: []
materials: []

teleporters:
    # 位置来自主人的绿色圆形标注；radius 就是画出来的圆半径。
    # 传送阵清怪后才会淡入（见 teleporter.ts 的 appearAlpha）。
    - id: to-beach
      x: 4260
      'y': 1115
      targetScene: beach-holiday
      targetPortalId: teleporter-msfmft58
      radius: 200
    - id: to-counter
      x: 224
      'y': 1573
      targetScene: starry-library-2-counter
      targetPortalId: from-entrance
      radius: 200
