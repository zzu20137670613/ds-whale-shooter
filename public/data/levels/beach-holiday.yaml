title: Beach Holiday
titleZh: '海滩假日'
# The world is 2x2 screens. The one-screen painting was cut into four tiles,
# upscaled 2x each, stitched back to 5504x3072, and the beach camp (lounger,
# parasol, side table) was composited into the north-west palm shade. Every
# coordinate below is the pre-doubling value times two; radii and timers are
# player-relative and deliberately unchanged.
background: assets/image/scenes/beach-holiday.png
imageSize: 5504x3072
airWalls:
    # Collision authored against the art, then doubled with the world: the
    # water's edge sits at x=1206 in the 5504x3072 image. Each palm trunk and
    # rock pile gets one small octagon,
    # kind: short like the hand-drawn forest walls. Fronds and their long
    # shadows do NOT collide - walking under a canopy is the point.
    #
    # The sea is wadeable for its inner third and solid beyond that: real
    # shores shoal, so the player may walk out to x=804 and no further. 804 is
    # two thirds of the 1206px sea, and it lands mid-gradient against the art's
    # own colours (deep teal 36,152,155 at x=0 lightening to 176,198,180 at the
    # shore), so the wadeable band reads as shallows rather than open water.
    # `top` and `bottom` start at the same x, so wading keeps the same 48px
    # inset from the painting's edge as the dry beach does.
    - id: deep-water
      kind: short
      points:
          - - 756
            - 0
          - - 804
            - 0
          - - 804
            - 3072
          - - 756
            - 3072
