characterSpawn:
    x: 2400
    'y': 1680
    facing: right

monsters: []
spawner:
    # 单块 5504x3072 内部再四等分成 2x2 象限，玩家第一次踏入某个象限时刷一波。
    # 波次：入口 1 / 柜台 2 / 露台 2 / 卷轴 3。每次进入都重新刷（不再读存档）。
    delayMs: 2000
    waves: 2
    near: { count: 4, minDistance: 300, maxDistance: 900 }
    far: { count: 5, edgeInset: 420 }
    exclude:
        # 主人 2026-11-12：`又出现了图书馆柜台关右下角大书桌这里刷怪的情况`。
        # 右下角那张斜放的大书桌（含椅子）在美术上是家具，怪站上去像浮在半空。
        # 世界坐标从底图上量的：桌子占 x 3900-5504 / y 1850-3072；这里再留一点余量。
        - { x: 3900, y: 1850, width: 1604, height: 1222 }
    # 血量倍数：拆分后按关卡重调，等主人给数值。
    pool:
        melee: [drone]     # 星穹潜行者
        ranged: [sniper]   # 星海狙手

dropSpawns: []
materials: []

teleporters:
    # 位置来自主人的绿色圆形标注；radius 就是画出来的圆半径。
    # 传送阵清怪后才会淡入（见 teleporter.ts 的 appearAlpha）。
    - id: from-entrance
      x: 5341
      'y': 1517
      targetScene: starry-library-1-entrance
      targetPortalId: to-counter
      radius: 200
    - id: to-terrace
      x: 1810
      'y': 2907
      targetScene: starry-library-3-terrace
      targetPortalId: from-counter
      radius: 200
