characterSpawn:
    x: 3700
    'y': 2500
    facing: right

monsters: []
spawner:
    # 单块 5504x3072 内部分成 2x2 象限，玩家第一次踏入某个象限刷一波。
    # 波数沿用图书馆：入口 1 / 第二关 2 / 第三关 2 / 第四关 3。每次进入都重刷。
    delayMs: 2000
    waves: 3
    near: { count: 4, minDistance: 300, maxDistance: 900 }
    far: { count: 5, edgeInset: 480, cornerInset: 900 }
    exclude:
        # 主人 2026-11-12：`亚特兰蒂斯最后一关的右上角还会刷怪，把这个角也给禁掉`。
        # 右上角那片是崖外的深水/珊瑚（美术上不可站人），怪会贴在屏幕最上沿露半个身子。
        # 世界坐标从底图上量的：深水 + 珊瑚约占 x 4000-5504 / y 0-700。
        - { x: 4000, y: 0, width: 1504, height: 700 }
    # 主人 2026-11-12 定的最后一波（第三波）配比：
    # 亚特兰蒂斯·加冕台：远处边缘 1 只奔波儿灞换 Wanderer。
    # 前两波不动；`far` 一项一只怪，按顺序占远处边缘的槽位。
    finalWave:
        far:
            - warden
            - bengbu-erba
            - warden
            - bengbu-erba
            - wanderer
    pool:
        melee: [warden]
        ranged: [bengbu-erba]

dropSpawns: []
materials: []

triggers:
    # 踩王座进 boss 教堂：不画魔法阵、不给光效，走到座位上前一步就切场景（单向）。
    # 旧 4x4 方案里这块在世界坐标 (7976,1296)，减掉本块原点 (5504,0) 就是下面这个矩形。
    - id: hidden-2-entry
      zone: { x: 2472, y: 1296, width: 344, height: 444 }
      travel:
          targetScene: warhammer-redeem-1-chapel
          # Claude 也踩得进去（主人 2026-11-12：`让你去掉的是这个`）。原来这里写着
          # `excludeCharacters: [claude]`，所以用 Claude 踩王座进不了 boss 关。
          requiresClear: true

teleporters:
    # 位置来自主人的绿圈，半径统一 200（2x2 规则）。
    - id: from-ruined-palace
      x: 4145
      'y': 2855
      targetScene: dsh-atlantis-3-ruined-palace
      targetPortalId: to-coronation-dais
      radius: 200

exitArrow:
    x: 2644
    y: 1690
    direction: up
    orbit: true
