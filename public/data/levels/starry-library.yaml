title: Starry Library
titleZh: 'Claude的星空图书馆'
# One world built out of the four painted blocks: 2x2 blocks of 5504x3072
# make an 11008x6144 level, so the camera rolls straight from what used to
# be a separate room into the next one - no doors, no portals in between.
# Blocks rather than one 11008x6144 texture: that single texture would be
# 258 MiB resident and can exceed the GPU's maximum texture size, while the
# four block PNGs are the art the levels already shipped (see
# whale-shooter/art-experiment/MULTIBLOCK-MAP-PIPELINE.md).
