# The beach portal that sent the player in, so the way back is the pair.
characterSpawn:
    x: 2800
    'y': 1500
    facing: right
teleporters:
    # Re-marked by the owner on 2026-10-21. The old pair at x=2800 is retired:
    # both sat within 1828 px of each other and the lower one had radius 180,
    # so a player arriving from the beach could be grabbed back down at once.
    # Radii are clamped to ground the player can actually stand on
    # (see art-source/ART-MARKING.md).
    - id: to-beach
      x: 9781
      'y': 1124
      targetScene: beach-holiday
      targetPortalId: teleporter-msfmft58
      radius: 300
    - id: to-sky-city
      x: 758
      'y': 5552
      targetScene: gpt-sky-city
      targetPortalId: to-library
      radius: 300
