characterSpawn:
    x: 500
    'y': 1600
    facing: right

monsters: []
# boss 本体：五阶段砍到四阶段后，每关跑一个阶段（下一步接线）。
boss: { monsterType: claude }
# 这一关只打第 2 阶段（四关对应四个阶段）。
bossPhase: 2
# 第二阶段的出场点：旧 4x4 方案里 Claude 每阶段换一块地图，这是她那块的站位（本地坐标）。
arenaSpawn:
    - { x: 2068, y: 1892 }
# boss 图原本没有区域刷怪器（旧 4x4 里整张图只有 Claude 一个 monster）。
# 主人若要每关也刷小怪，把下面这段解注即可。
# spawner:
#     # 单块 5504x3072 内部分成 2x2 象限，玩家第一次踏入某个象限刷一波。
#     # 波数沿用图书馆：入口 1 / 第二关 2 / 第三关 2 / 第四关 3。每次进入都重刷。
#     delayMs: 2000
#     waves: 2
#     near: { count: 4, minDistance: 300, maxDistance: 900 }
#     far: { count: 5, edgeInset: 420 }
#     hpMultiplier: 2
#     meleeHpMultiplier: 2
#     pool:
#         melee: [drone]
#         ranged: [sniper]

dropSpawns: []
materials: []

teleporters:
    # 位置来自主人的绿圈，半径统一 200（2x2 规则）。
    - id: from-chapel
      x: 302
      'y': 1784
      targetScene: warhammer-redeem-1-chapel
      targetPortalId: to-warship
      radius: 200
    - id: to-fireworks
      x: 2400
      'y': 2853
      targetScene: warhammer-redeem-3-fireworks
      targetPortalId: from-warship
      radius: 200
