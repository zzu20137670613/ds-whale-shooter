characterSpawn:
    x: 3100
    'y': 1600
    facing: right

monsters: []
# boss 本体：五阶段砍到四阶段后，每关跑一个阶段（下一步接线）。
boss: { monsterType: claude }
# 这一关只打第 4 阶段（四关对应四个阶段）。
bossPhase: 4
# 第四阶段的出场点：旧 4x4 方案里 Claude 每阶段换一块地图，这是她那块的站位（本地坐标）。
arenaSpawn:
    - { x: 2564, y: 1696 }
# boss 图原本没有区域刷怪器（旧 4x4 里整张图只有 Claude 一个 monster）。
# 主人若要每关也刷小怪，把下面这段解注即可。
# spawner:
#     # 单块 5504x3072 内部分成 2x2 象限，玩家第一次踏入某个象限刷一波。
#     # 波数沿用图书馆：入口 1 / 第二关 2 / 第三关 2 / 第四关 3。每次进入都重刷。
#     delayMs: 2000
#     waves: 3
#     near: { count: 4, minDistance: 300, maxDistance: 900 }
#     far: { count: 5, edgeInset: 420 }
#     hpMultiplier: 2
#     meleeHpMultiplier: 2
#     pool:
#         melee: [drone]
#         ranged: [sniper]

dropSpawns: []
materials: []

interactables:
    # 不锈钢饭盆：主人这次把黄圈画在初遇之地 (2946,1517)。旧 4x4 方案里它在街巷那块，
    # 现在跟着新标注走；矩形按黄圈直径 458 外扩一圈，保证走进去就算触发。
    - id: rice-bowl
      action: rice-bowl
      # 主人 2026-11-15 最终定的是「一进这张图就触发」，不再靠走进圈里：
      # `进入boss战第四关自动出第一句的提示，背包多个白米饭，重复刷boss关再出第二句提示`。
      # zones 留在原处只当"饭盆画在哪"的备注，`trigger: enter` 不读它。
      trigger: enter
      # 原来是主人画的那个 458 直径圆的**外接方框**（2717,1288 起），它把出生点
      # (3100,1600) 也框进去了 —— 2026-11-15 主人实测`刚进图直接就报提示`、真去踩碗反而
      # 没反应。收紧成 220 见方，圆心不变 (2946,1517)，出生点在圈外。
      zones:
          - { x: 2836, y: 1407, width: 220, height: 220 }

teleporters:
    []   # 本关没有传送阵（初遇之地只有铁盆彩蛋）
