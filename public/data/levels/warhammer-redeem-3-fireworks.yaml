      x: 5287
      'y': 1571
      targetScene: warhammer-redeem-2-warship
      targetPortalId: to-fireworks
      radius: 200
    - id: to-first-meeting
      x: 269
      'y': 1436
      targetScene: warhammer-redeem-4-first-meeting
      radius: 200
