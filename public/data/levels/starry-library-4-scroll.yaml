characterSpawn:
    x: 1360
    'y': 1280
    facing: right

monsters: []
spawner:
    # 单块 5504x3072 内部再四等分成 2x2 象限，玩家第一次踏入某个象限时刷一波。
    # 波次：入口 1 / 柜台 2 / 露台 2 / 卷轴 3。每次进入都重新刷（不再读存档）。
    delayMs: 2000
    waves: 3
    near: { count: 4, minDistance: 300, maxDistance: 900 }
    far: { count: 5, edgeInset: 420 }
    # 血量倍数：拆分后按关卡重调，等主人给数值。
    # 主人 2026-11-12 定的最后一波（第三波）配比：
    # 图书馆·卷轴：远处边缘 1 只星海狙击手换 Kitty，2 只星空潜行者换云海德鲁伊。
    # 前两波不动；`far` 一项一只怪，按顺序占远处边缘的槽位。
    finalWave:
        far:
            - keeper
            - sniper
            - keeper
            - sniper
            - kitty
    pool:
        melee: [drone]     # 星穹潜行者
        ranged: [sniper]   # 星海狙手

dropSpawns: []
materials: []

teleporters:
    # 位置来自主人的绿色圆形标注；radius 就是画出来的圆半径。
    # 传送阵清怪后才会淡入（见 teleporter.ts 的 appearAlpha）。
    - id: from-terrace
      x: 5327
      'y': 1502
      targetScene: starry-library-3-terrace
      targetPortalId: to-scroll
      radius: 200
    - id: to-sky-city
      x: 763
      'y': 2471
      targetScene: gpt-sky-city-1-entrance
      targetPortalId: to-library
      radius: 200
