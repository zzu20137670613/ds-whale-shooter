characterSpawn:
    x: 700
    'y': 1600
    facing: right

monsters: []
spawner:
    # 单块 5504x3072 内部分成 2x2 象限，玩家第一次踏入某个象限刷一波。
    # 波数沿用图书馆：入口 1 / 第二关 2 / 第三关 2 / 第四关 3。每次进入都重刷。
    delayMs: 2000
    waves: 3
    near: { count: 4, minDistance: 300, maxDistance: 900 }
    far: { count: 5, edgeInset: 480 }
    exclude:
        # 从旧 4x4 spawner 搬来的禁刷矩形（本地坐标）：屋顶、王座高台、
        # 以及海边那条窄条，都是美术上不可站人的地方。
        - { x: 592, y: 704, width: 3616, height: 2368 }
        - { x: 3504, y: 1552, width: 2000, height: 1520 }
    # 主人 2026-11-12 定的最后一波（第三波）配比：
    # 天空之城·王厅：远处边缘 1 只龙城守卫换 Bunny，2 只云海德鲁伊换钢铁典狱长。
    # 前两波不动；`far` 一项一只怪，按顺序占远处边缘的槽位。
    finalWave:
        far:
            - warden
            - drone-ultra
            - warden
            - drone-ultra
            - bunny
    pool:
        melee: [keeper]
        ranged: [drone-ultra]

dropSpawns: []
materials: []

triggers:
    # 龙王宝座彩蛋：撞一下靠背，白龙獠牙从顶上飞出来落在座位上。谁都能触发，每人一句台词，
    # 每次存档只给一次。旧方案里这块在世界坐标 (5504,3072) 起，减掉原点就是下面的本地坐标。
    - id: dragon-throne-fangs
      # The seat plus its approach. It used to be a 110px strip hugging the wall,
      # so standing half a step low missed it entirely (`在龙王王座上没有掉下白龙獠牙`).
      zone: { x: 2446, y: 1358, width: 720, height: 360 }
      line:
          default: '哇！GPT藏起来的白龙獠牙，好漂亮的枪！'
          gpt: '还好还好~藏起来的獠牙还在！'
      # 过场：獠牙一蹦出来就播《一夜鱼龙舞》（主人的素材，7.1 MB）。
      video: assets/video/night-of-dragons.mp4
      spawn:
          type: weapon-drop
          weaponId: white-dragon-fangs
          from: { x: 2778, y: 488 }
          to: { x: 2778, y: 1548 }
          lift: 120
          durationMs: 750

teleporters:
    # 位置来自主人的绿圈，半径统一 200（2x2 规则）。
    - id: from-great-tome
      x: 2727
      'y': 227
      targetScene: gpt-sky-city-3-great-tome
      targetPortalId: to-throne-hall
      radius: 200
    - id: to-atlantis
      x: 2834
      'y': 2702
      targetScene: dsh-atlantis-1-entrance
      targetPortalId: from-sky-city
      radius: 200
