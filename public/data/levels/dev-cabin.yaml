# Hidden level 3 - the developer's own room.
#
# Reached by shooting the framed picture on the pavilion wall and stepping into
# the hole behind it. One screen, no blocks: a single 2752x1536 painting, the
# same spec as the tavern.
#
# The whole point of this room is the desk. The two screens are click targets
# (`interactables` below) that open a mail window addressed to the person whose
# machine this is - the one place in the game that breaks the fourth wall.
#
# Walls are authored by hand from the painting: the room's four edges, the
# worktable along the top, the shelf on the left, the bunk corner on the right,
# the beanbag and the whiteboard. Nothing here is reachable by walking except
# the floor in front of the desk, which is the idea - you can look, not sit.
title: The Developer's Cabin
titleZh: '开发者小屋'
background: assets/image/scenes/dev-cabin.png
imageSize: 2752x1536
# Same reason as the tavern: the painting already carries its own light.
pixelLighting: false
airWalls:
    - id: edge-left
      kind: short
      points: [[0, 0], [44, 0], [44, 1536], [0, 1536]]
    - id: edge-right
      kind: short
      points: [[2708, 0], [2752, 0], [2752, 1536], [2708, 1536]]
    - id: edge-top
      kind: short
      points: [[0, 0], [2752, 0], [2752, 44], [0, 44]]
    - id: edge-bottom
      kind: short
      points: [[0, 1492], [2752, 1492], [2752, 1536], [0, 1536]]
    # The worktable. You cannot climb onto someone's desk.
    - id: worktable
      kind: short
      points: [[905, 250], [2130, 250], [2130, 1010], [905, 1010]]
    # Bookshelf and the pinboard on the left wall.
    - id: shelf
      kind: short
      points: [[140, 60], [470, 60], [470, 1010], [140, 1010]]
    # The bunk bed corner and the plant on the right.
    - id: bunk
      kind: short
      points: [[2330, 60], [2700, 60], [2700, 1180], [2330, 1180]]
    # The beanbag with the cats on it.
    - id: beanbag
      kind: short
      points: [[300, 1060], [860, 1060], [860, 1460], [300, 1460]]
interactables:
    # Both screens open the same window. The rectangles are the two green marks
    # the owner painted on the art, converted from 2560x1440 to this canvas:
    #   laptop  2560-space 1042..1311 x 282..451
    #   monitor 2560-space 1407..1721 x 297..542
    # A shot still fires when you click (this is a shooter), which is why the
    # rectangle has to be tight enough to feel like a button and not the desk.
    - id: dev-desk-mail
      action: dev-mail
      zones:
          - { x: 1120, y: 303, width: 289, height: 182 }
          - { x: 1513, y: 319, width: 338, height: 263 }

characterSpawn:
    x: 1376
    y: 1180
    facing: right
teleporters:
    # Back through the hole you came in by. `requiresClear: false` for the same
    # reason the tavern's exit has it: a level with nothing to kill must never
    # trap the player.
    - id: dev-cabin-exit
      x: 1376
      'y': 1440
      targetScene: tavern
      targetPortalId: hidden-1-entrance
      requiresClear: false
      radius: 90
