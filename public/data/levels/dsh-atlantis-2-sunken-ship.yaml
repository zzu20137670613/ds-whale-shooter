characterSpawn:
    x: 1700
    'y': 1500
    facing: right

monsters: []
spawner:
    # 单块 5504x3072 内部分成 2x2 象限，玩家第一次踏入某个象限刷一波。
    # 波数沿用图书馆：入口 1 / 第二关 2 / 第三关 2 / 第四关 3。每次进入都重刷。
    delayMs: 2000
    waves: 2
    near: { count: 4, minDistance: 300, maxDistance: 900 }
    far: { count: 5, edgeInset: 480, cornerInset: 900 }
    pool:
        melee: [warden]
        ranged: [bengbu-erba]

dropSpawns: []
materials: []

teleporters:
    # 位置来自主人的绿圈，半径统一 200（2x2 规则）。
    - id: from-entrance
      x: 281
      'y': 1574
      targetScene: dsh-atlantis-1-entrance
      targetPortalId: to-sunken-ship
      radius: 200
    - id: to-ruined-palace
      x: 4673
      'y': 2327
      targetScene: dsh-atlantis-3-ruined-palace
      targetPortalId: from-sunken-ship
      radius: 200
