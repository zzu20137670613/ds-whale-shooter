titleZh: 'dsh的亚特兰蒂斯·遗落之船'

# 2x2 拆分：本关是原来 11008x6144 地图的一块 5504x3072。
# 碰撞墙来自主人 2026-11-11 的按块标注（红=不可达），128px 网格合并成矩形。
background: assets/image/scenes/dsh-atlantis/atlantis-1-wreck.png
imageSize: 5504x3072
# 旧 4x4 版这张图就是 pixelLighting: false（差分光效会把画面压暗，
# 主人报过「月桥色调明显偏暗」）；拆开后每块都要带上这一行。
pixelLighting: false
# 主人 2026-11-12 实测：亮色光柱在亚特兰蒂斯看不清，这里也用深色。
tokenPillarTone: gold

