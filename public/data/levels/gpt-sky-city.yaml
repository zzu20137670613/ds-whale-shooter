# GPT's Sky City — the 4x4 painted map that landed on 2026-10-21.
#
# Layout (2x2 blocks of 5504x3072, world 11008x6144):
#   NW = gate + upper stairs   NE = book pavilion
#   SW = moon-bridge landing   SE = before the throne
# Play order is SW -> NW -> NE -> SE, so the spawn sits in the landing block.
# The light disc under the throne doubles as the way down to Atlantis.
#
# The old traced walls belonged to the placeholder art and are gone; only the
# world boundary is authored here. Feature walls will be derived from the new
# art once its masks are drawn (scripts/walls-from-art.py).
