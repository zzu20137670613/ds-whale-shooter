music: forest-ambient
# The pavilion is a bright midday scene, and its art is photographic rather
# than pixel art. The default pixel-lighting pass multiplies the background
# by a twilight tint (0x6c7c8c, i.e. x0.48) and adds a 32-step quantise
# filter — on this background that reads as "why is the pretty picture so
# dark in game". Off, so the art arrives as drawn.
pixelLighting: false
tavern: true
npcSpawns:
    # The five seats sit in the LOWER half of the deck on purpose. The
    # selection card is pinned above the character's head, and it is
    # ~400px tall (HUD art space) — with the head near the top of this
    # 2752x1536 frame the card ran off the top of the screen. Feet at
    # y 1150-1250 leave room for the whole card at every window shape
    # the game is played at. x is spaced 365 apart because the actors
    # are drawn at TAVERN_ACTOR_SCALE (1.8), so claude is ~357px wide.
    - characterId: claude
      x: 900
      'y': 1150
    - characterId: gpt
      x: 1265
      'y': 1210
    - characterId: qwen
      x: 1630
      'y': 1250
    - characterId: seed
      x: 1995
      'y': 1220
    - characterId: deepseek
      x: 2360
      'y': 1180
# The wall ornament is a monster, not a breakable material: it carries the sprite cut
# from the original art, so killing it makes the sprite vanish and the black cover
# baked into tavern.png appear. Its weapon is ranged with range 1, which keeps it from
# ever entering the attack state and exempts it from contact damage. While the "dummy
# prop" flag does not exist yet this thing still shows an HP bar, floats damage numbers
# and creeps toward the player at moveSpeed, and the engine mirrors its sprite by
# facing — the sprite art is pre-mirrored to compensate.
monsters:
    - type: hollow-emblem
      x: 2642
      'y': 896
materials: []
teleporters:
    - id: tavern-exit
      x: 1355
      'y': 1425
      targetScene: beach-holiday
        # The one tavern portal that must never be gated: the player has to
      # be able to leave. Every other portal here defaults to gated, which
      # is what makes the ornament's hole and its portal appear together.
      targetPortalId: tavern-return
      requiresClear: false
      radius: 60
    # Hidden level 1 (sunlit-henge). The wall ornament at x 2614..2720, y 838..952
    # is a prop monster: shoot it and its sprite vanishes, revealing the black
    # hole baked into tavern.png. This portal stays dark until then, because the
    # tavern's only monster is that ornament and the portal is gated on the
    # monster clear, so the hole and the portal appear together. wall-3a/3b/3c
    # form the doorway around it; radius 90 keeps the trigger inside the alcove,
    # so the player has to step into the hole rather than brush past the wall
    # from the deck.
    - id: hidden-1-entrance
      x: 2667
      'y': 895
      targetScene: sunlit-henge
      targetPortalId: teleporter-msfpy6pw
      requiresClear: true
      radius: 90