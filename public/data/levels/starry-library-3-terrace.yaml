characterSpawn:
    x: 1280
    'y': 1280
    facing: right

monsters: []
spawner:
    # 单块 5504x3072 内部再四等分成 2x2 象限，玩家第一次踏入某个象限时刷一波。
    # 波次：入口 1 / 柜台 2 / 露台 2 / 卷轴 3。每次进入都重新刷（不再读存档）。
    delayMs: 2000
    waves: 2
    near: { count: 4, minDistance: 300, maxDistance: 900 }
    far: { count: 5, edgeInset: 420 }
    # 血量倍数：拆分后按关卡重调，等主人给数值。
    pool:
        melee: [drone]     # 星穹潜行者
        ranged: [sniper]   # 星海狙手

dropSpawns: []
materials: []

teleporters:
    # 位置来自主人的绿色圆形标注；radius 就是画出来的圆半径。
    # 传送阵清怪后才会淡入（见 teleporter.ts 的 appearAlpha）。
    - id: from-counter
      x: 2871
      'y': 196
      targetScene: starry-library-2-counter
      targetPortalId: to-terrace
      radius: 200
    - id: to-scroll
      x: 201
      'y': 1550
