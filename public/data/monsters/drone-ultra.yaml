name: Thorn Drone
nameZh: "荆棘无人机"
hp: 70
money: 30
moveSpeed: 3
body:
    halfW: 28
    halfH: 28
weaponId: bramble-knuckles
sfx:
    hit: monster-hit
    death: monster-death
    aggro: monster-aggro
drops:
    # 怪物掉落表（表·2026-10-29 定稿）：一行一次抽，档位从高往低套。
    # 掉3个 命中就吃掉 掉2个 和 概率%，都没中才掉 1 个或 0 个。
    - dropId: hp-shard
      chance: 1
      chance2: 0.2
    - dropId: sp-fragment
      chance: 0.4
    - dropId: ammo-cache
      chance: 0.3
      chance2: 0.01
    - dropId: overcharge-core
      chance: 0.15
sprite:
    texture: assets/image/monsters/drone.png
    grid: { rows: 4, cols: 4 }
    scale: 1.2
    offset: { left: 0, bottom: 4 }
    script:
        downsample: 4
        colors: 32
        pad: 2

anims:
    idle:
        frames: [0, 3]
        frameRate: 6
        repeat: -1
    move:
        frames: [4, 7]
        frameRate: 10
        repeat: -1
    hit:
        frames: [8, 11]
        frameRate: 12
        repeat: -1
    death:
        frames: [12, 14]
        frameRate: 10
        repeat: 0
