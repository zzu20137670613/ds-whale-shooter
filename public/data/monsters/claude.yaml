# PLACEHOLDER BOSS - Claude in the Warhammer line.
#
# Everything here is deliberately temporary, so the whole hidden level can be
# walked end to end before a single phase is written:
#   - Phase 1 numbers are in place (hp 4000 / armor 20 / speed 7); the five
#     phases themselves are not written yet, so she still fires one borrowed
#     weapon and just closes in.
#   - no phase logic, no bespoke attacks; she carries the weakest weapon in the
#     game so the MonsterController has one, and mostly just closes in
#   - the visual is her PLAYABLE character sheet, so the placeholder at least
#     reads as Claude. When the boss sheet is drawn, swap `sprite.texture` and
#     the `anims` frames here - nothing else needs to change.
name: Claude
nameZh: '克劳德（占位）'
# 阶段 1 · 灭世：主人定的基准值。其余阶段按倍率算
# （神 150% → HP 6000 / 护甲 30；半神 80% → 护甲 16；半神半人 50% → 护甲 10）。
# Five phases, not one health bar: the ladder lives in
# src/lib/bosses/phases.ts.
boss: true
hp: 4000
armor: 20
money: 0
moveSpeed: 7
# Collision body scaled 1.5x with the art: the player's is 60x60, so at 90x102
# she reads as "one size bigger" without becoming a wall you cannot walk around.
# Keep the body-to-sprite ratio when the real boss sheet arrives
# (102 / 384 = 26.6%, the same share the placeholder has today).
body:
    halfW: 45
    halfH: 51
weaponId: rune-shield
sfx:
    hit: monster-hit
    death: monster-death
    aggro: monster-aggro
sprite:
    # Her own sheet: 4x4, 256px frames, keyed off the magenta and re-gridded so
    # every frame is centred and nothing is clipped (the raw art had 13px of
    # layout drift per column).
    # 256 * 1.5 = 384px on screen - one size above the player's 256, which is the
    # "bigger, but still walk-around-able" the owner asked for.
    texture: assets/image/monsters/claude-boss.png
    grid:
        rows: 4
        cols: 4
    scale: 1.5
    offset:
        left: 0
        bottom: 0
anims:
    # Row 1: standing with the book.
    idle:
        frames: [0, 3]
        frameRate: 6
        repeat: -1
    # Row 2: the turn-in. Played once when she notices the player, then `move`.
    # There is no left-facing copy of the art: the sprite flips on the X axis, so
    # this one turn serves both directions.
    turn:
        frames: [4, 7]
        frameRate: 12
        repeat: 0
    # Row 3: the stride.
    move:
        frames: [8, 11]
        frameRate: 10
        repeat: -1
    # Row 4: the crouch. The owner's call - this is her wind-up/cast, not a hit
    # reaction. `hit` is deliberately absent: getting shot flashes the sprite and
    # leaves the animation alone.
    cast:
        frames: [12, 15]
        frameRate: 8
        repeat: 0
    death:
        frames: [12, 15]
        frameRate: 10
        repeat: 0
