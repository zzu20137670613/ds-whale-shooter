# PLACEHOLDER BOSS - Claude in the Warhammer line.
#
# Everything here is deliberately temporary, so the whole hidden level can be
# walked end to end before a single phase is written:
#   - Phase 1 numbers are in place (hp 4000 / armor 20 / speed 7); the five
#     phases themselves are not written yet, so she still fires one borrowed
#     weapon and just closes in.
#   - no phase logic, no bespoke attacks; she carries the weakest weapon in the
#     game so the MonsterController has one, and mostly just closes in
#   - the visual is her PLAYABLE character sheet, so the placeholder at least
#     reads as Claude. When the boss sheet is drawn, swap `sprite.texture` and
#     the `anims` frames here - nothing else needs to change.
name: Claude
nameZh: '克劳德（占位）'
# 阶段 1 · 灭世：主人定的基准值。其余阶段按倍率算
# （神 150% → HP 6000 / 护甲 30；半神 80% → 护甲 16；半神半人 50% → 护甲 10）。
hp: 4000
armor: 20
money: 0
moveSpeed: 7
# Collision body scaled 1.5x with the art: the player's is 60x60, so at 90x102
# she reads as "one size bigger" without becoming a wall you cannot walk around.
# Keep the body-to-sprite ratio when the real boss sheet arrives
# (102 / 384 = 26.6%, the same share the placeholder has today).
body:
    halfW: 45
    halfH: 51
weaponId: rune-shield
sfx:
    hit: monster-hit
    death: monster-death
    aggro: monster-aggro
sprite:
    # Placeholder: her playable sheet at 1.5x, so the fight already looks like a
    # boss before the real art exists. 128px frame * 3 = 384px tall (the player
    # renders at 256), i.e. exactly half a size up.
    # When the 3096x3096 sheet lands, swap texture + grid and recompute scale:
    #   a 4x4 grid (774px frames) -> scale 0.5   (774 * 0.5 = 387)
    #   a single 3096 frame       -> scale 0.124 (3096 * 0.124 = 384)
    texture: assets/image/characters/claude.png
    grid:
        rows: 4
        cols: 4
    scale: 3
    offset:
        left: 0
        bottom: 0
anims:
    idle:
        frames: [0, 3]
        frameRate: 6
        repeat: -1
    move:
        frames: [4, 7]
        frameRate: 10
        repeat: -1
    hit:
        frames: [12, 15]
        frameRate: 14
        repeat: 0
    death:
        frames: [12, 15]
        frameRate: 10
        repeat: 0
