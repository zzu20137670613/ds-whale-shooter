# Real art. Generated from her single front-view reference and processed with
# tools/split-sheet-pale.py rather than scripts/split-sheet.ts: the house
# splitter's Lch key eats a white/pale character on magenta, and its blob-based
# frame extraction splits a run row drawn with detached hair. The AI output is
# archived in raws/.
id: claude
name: Claude
nameZh: "Claude"
description: |
    A tall, unhurried scholar who treats the battlefield as a page to be annotated. Slow to arrive and slow to fall, she answers the room one long shot at a time and would rather already have the answer than be fast about finding it.
descriptionZh: |
    个子高、做事慢的学者，把战场当成一页等着批注的稿纸。来得慢，倒得也慢；她一向用一发长射回敬整个房间，宁愿答案先在手，也不愿快着去找。
imageSize: 2048x2048
prompt: |
    The 11th Forest — Claude sprite sheet

    Claude — thick and slow, long-range single shot, book/page motif.

    Layout and hard negatives follow the house format documented in
    `deepseek.yaml`: 2048x2048, 4x4 grid, one flat continuous magenta field,
    no grid lines, no text, no watermark, and the same character in all 16
    cells — idle (row 1), walk (row 2), run (row 3), dodge (row 4).
hp: 130
armor: 0
spRegenPerSec: 0.5
sp: 70
luck: 1
moveSpeed: 5
spRegenMs: 5200
gender: female
body:
    halfW: 30
    halfH: 30
dodge:
    spCost: 16
    speed: 13
    durationMs: 240
    cooldownMs: 700
hotbar:
    - scripture
    - inkwell-mortar

skill:
    # Darkening (黑化) — twenty seconds of doubled attack damage, once a
    # minute. The cooldown starts the moment it is used. SP cost is a
    # placeholder until the owner's balance pass.
    name: Darkening
    nameZh: "黑化"
    kind: darkening
    spCost: 40
    cooldownMs: 60000
    buffMs: 20000
    damageMul: 2
weaponMax: 3
upgrades:
    # 四条梯子，级数 = costs.length；价格是角色之间的区分度，效果是全局规则。
    armor:
        # 护甲：固定减伤 -5/级，满级 -25。承伤 = max(0, 伤害 - 护甲)，不会回血。
        costs: [24, 48, 80, 120, 176]
        effects:
            - { stat: armor, mode: add, perLevel: 5 }
    agility:
        # 敏捷：移速绝对值 +0.3/级。
        costs: [52, 104, 168, 248, 352]
        effects:
            - { stat: moveSpeed, mode: add, perLevel: 0.3 }
    spirit:
        # 灵力：每级 +10 HP 上限、+10 SP 上限、+0.3 SP/秒。
        costs: [44, 88, 144, 212, 300]
        effects:
            - { stat: hp, mode: add, perLevel: 10 }
            - { stat: sp, mode: add, perLevel: 10 }
            - { stat: spRegenPerSec, mode: add, perLevel: 0.3 }
    luck:
        # 幸运：+1/级，5 级。幸运 10 = 100% 暴击（双倍伤害）。
        costs: [96, 192, 312, 480, 744]
        effects:
            - { stat: luck, mode: add, perLevel: 1 }
stats:
    # Display-only radar values for the tavern select card (1-10).
    strength: 3
    agility: 2
    vitality: 9
    spirit: 4
sfx:
    dodge: dodge
    hurtFemale: player-hurt-female
    throttleMs: 1200
    footstep: footstep
    footstepThrottleMs: 200
    lowHpHeartbeat: low-hp-heartbeat
    lowHpThreshold: 0.3
    lowHpPulseMs: 900
sprite:
    texture: assets/image/characters/claude.png
    grid:
        rows: 4
        cols: 4
    # 768 sheet (192px cells) built straight from `raws/claude.png` (1536, 4x4): magenta
    # keyed, edge fringe cleaned, LANCZOS to 768, alpha forced hard, then 32 colours to
    # match the rest of the roster. The old 512 sheet (128px cells) was drawn at
    # scale 1.55 and read as blurry - it was upscaling its own art.
    # Visual scale tracks `body` against deepseek's 26x26 → 1.35, so the
    # sprite and the physics box stay in proportion across the roster.
    scale: 1.55
    offset:
        left: -2
        bottom: -4
    # Provenance for `texture`: the 1536x1536 sheet in raws/ (magenta field, 4x4,
    # Doubao watermark) was de-watermarked, keyed at RGB distance 50, shrunk 2px,
    # downsampled 3x and quantised to 32 colours, cropping each cell by the grid.
    script:
        downsample: 3
        colors: 32
        pad: 2
anims:
    idle:
        # Static, on purpose. The four idle frames were generated separately, so they are
        # near-identical poses a few pixels apart - looping them read as a twitch, worst on
        # the pale characters. Walking, running and dodging still animate.
        frames:
            - 0
            - 0
        frameRate: 1
        repeat: -1
    walk:
        frames:
            - 4
            - 7
        frameRate: 10
        repeat: -1
    run:
        frames:
            - 8
            - 11
        frameRate: 12
        repeat: -1
    dodge:
        frames:
            - 12
            - 15
        frameRate: 14
        repeat: 0
