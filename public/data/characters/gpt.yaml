# Real art (generated from her own three-view reference, keyed with the
# conservative RGB pass — magenta keying eats pale characters, see
# project_memory.md). The AI output is archived in raws/.
# NOTE: her sheet came from an earlier pass that used a THREE-VIEW reference. The
# house rule since is a SINGLE FRONT VIEW: a side or back view in the reference
# teaches the model those facings, and the engine flips the sprite horizontally
# for movement, so she ends up facing away from the direction she walks. Claude,
# Qwen and Seed were all built from one front view.
id: gpt
name: GPT
nameZh: "GPT"
description: |
    A small white dragon-girl who has never once been the last one standing and does not intend to start now. Everything about her is fast — the run, the reload, the apology she offers after ricocheting off three walls.
descriptionZh: |
    小小的白龙娘，从来没当过最后一个站着的人，也不打算从现在开始。她身上一切都快——跑得快、换弹快，连撞了三面墙之后道歉也快。
imageSize: 2048x2048
prompt: |
    DS Whale Shooter — GPT sprite sheet

    GPT — fast and fragile, rapid fire, white dragon / twin-tail sets.

    Layout and hard negatives follow the house format documented in
    `deepseek.yaml`: 2048x2048, 4x4 grid, one flat continuous magenta field,
    no grid lines, no text, no watermark, and the same character in all 16
    cells — idle (row 1), walk (row 2), run (row 3), dodge (row 4).
hp: 120
armor: 0
spRegenPerSec: 0.5
sp: 180
luck: 3
moveSpeed: 6.0
spRegenMs: 3000
gender: female
body:
    halfW: 22
    halfH: 22
dodge:
    spCost: 10
    speed: 18
    durationMs: 180
    cooldownMs: 420
hotbar:
    - nashors-tooth
    - white-dragon-fangs

skill:
    # Dragon Roar (龙吟) — every monster the camera can see loses half of its
    # MAX HP at once, so anything already below half dies outright; a boss loses a quarter
    # (`小怪扣一半，boss扣1/4`, owner 2026-11-14). The cooldown starts the moment it fires, and
    # the monsters take the hit themselves (game/monsters listens for `skill:dragon-roar`).
    #
    # Price is FLAT (owner 2026-11-14: `改成初始放一次扣150SP`). It used to be
    # `spCostFraction: 1` - "the whole bar" - which was fine while the pool was 80, but the
    # pool went to 180 on 2026-10-30 and the roar silently doubled with it. 150 of 180 leaves
    # room to move, and it does not move when the spirit ladder grows the bar.
    name: Dragon Roar
    nameZh: "龙吟"
    kind: dragon-roar
    spCost: 150
    cooldownMs: 60000
    hpFraction: 0.5
weaponMax: 4
upgrades:
    # 五条梯子，级数 = costs.length；价格是角色之间的区分度，效果是全局规则。
    armor:
        # 护甲：固定减伤 -5/级，满级 -25。承伤 = max(0, 伤害 - 护甲)，不会回血。
        costs: [40, 80, 132, 198, 288]
        effects:
            - { stat: armor, mode: add, perLevel: 5 }
    agility:
        # 敏捷：移速绝对值 +0.3/级。
        costs: [30, 60, 98, 144, 204]
        effects:
            - { stat: moveSpeed, mode: add, perLevel: 0.3 }
    hp:
        # 血量：每级 +20 最大血量上限，满级 +100。
        costs: [35, 70, 115, 170, 240]
        effects:
            - { stat: hp, mode: add, perLevel: 20 }
    spirit:
        # 灵力：每级 +10 HP 上限、+10 SP 上限、+0.3 SP/秒。
        costs: [26, 52, 86, 126, 180]
        effects:
            - { stat: hp, mode: add, perLevel: 10 }
            - { stat: sp, mode: add, perLevel: 10 }
            - { stat: spRegenPerSec, mode: add, perLevel: 0.3 }
    luck:
        # 幸运：+1/级，5 级。幸运 10 = 100% 暴击（双倍伤害）。
        costs: [64, 128, 208, 320, 496]
        effects:
            - { stat: luck, mode: add, perLevel: 1 }
stats:
    # Display-only radar values for the tavern select card (1-10).
    strength: 4
    agility: 10
    vitality: 3
    spirit: 7
sfx:
    dodge: dodge
    hurtFemale: player-hurt-female
    throttleMs: 1200
    footstep: footstep
    footstepThrottleMs: 200
    lowHpHeartbeat: low-hp-heartbeat
    lowHpThreshold: 0.3
    lowHpPulseMs: 900
sprite:
    texture: assets/image/characters/gpt/gpt.png
    grid:
        rows: 4
        cols: 4
    # Visual scale tracks `body` against deepseek's 26x26 → 1.35, so the
    # sprite and the physics box stay in proportion across the roster.
    # 1.35, in line with DeepSeek and Qwen. She shipped at 1.15 and read half a
    # head shorter than the rest of the roster on the same floor.
    scale: 0.4505
    offset:
        left: -4
        bottom: 0
    # Re-cut from raws/gpt.png at FULL resolution: no downsample, no palette
    # reduction, no edge erosion. The old 768 sheet ran --downsample=3 --colors=32
    # --outline=2, and the erosion + 32-colour palette ate her wings, lace and
    # chain detail (the owner: `抠图抠掉的颜色太多了`).
    script:
        downsample: 1
        pad: 0
anims:
    idle:
        # Static, on purpose. The four idle frames were generated separately, so they are
        # near-identical poses a few pixels apart - looping them read as a twitch, worst on
        # the pale characters. Walking, running and dodging still animate.
        frames:
            - 0
            - 0
        frameRate: 1
        repeat: -1

    walk:
        frames:
            - 4
            - 7
        frameRate: 10
        repeat: -1
    # ── run: OFF (2026-11-09) ───────────────────────────────
    # 奔跑动作五个角色没一个合格，主人决定先不播。美术重画后把下面的
    # 注释去掉、并恢复 logic.ts 里 driveAnims 的 sprint 分支即可。
    # run:
    #        frames:
    #            - 8
    #            - 11
    #        frameRate: 12
    #        repeat: -1
    dodge:
        frames:
            - 12
            - 15
        frameRate: 20
        repeat: 0
