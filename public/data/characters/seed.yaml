# Real art. She arrived as a proper 4x4, so the plate worked as intended; see the
# provenance note on `sprite.script`. Ready to regenerate? The plate is
# 底板F_Seed_4x4结构底_2048_品红底.png.
id: seed
name: Seed
nameZh: "Seed"
description: |
    The one who keeps everyone else supplied. She wears the official mascot head as a helmet: on, and she is the brand; off, and she is herself, already handing you something you did not know you needed.
descriptionZh: |
    负责张罗大家的那个。她把官方吉祥物头套当头盔戴：戴上就是官方形象，摘了就是她自己——而她已经把你还不知道自己需要的东西递过来了。
imageSize: 2048x2048
prompt: |
    The 11th Forest — Seed sprite sheet

    Seed — support. The official mascot look becomes a wearable headgear (skill).

    Layout and hard negatives follow the house format documented in
    `deepseek.yaml`: 2048x2048, 4x4 grid, one flat continuous magenta field,
    no grid lines, no text, no watermark, and the same character in all 16
    cells — idle (row 1), walk (row 2), run (row 3), dodge (row 4).
hp: 105
sp: 90
luck: 6
moveSpeed: 5.2
spRegenMs: 2600
gender: female
body:
    halfW: 28
    halfH: 28
dodge:
    spCost: 12
    speed: 14
    durationMs: 220
    cooldownMs: 560
hotbar:
    - frostmourne
    - assault-rifle

weaponMax: 4
upgrades:
    # Tavern upgrade ladders. `costs.length` IS the max level. The cheapest
    # column is the character's own growth axis — that is what separates the
    # five AI girls from each other, see 角色数值总表.md.
    armor:
        costs: [26, 52, 86, 126, 180]
        effects:
            - { stat: hp, mode: mul, perLevel: 1.12 }
    agility:
        costs: [48, 96, 156, 228, 324]
        effects:
            - { stat: moveSpeed, mode: mul, perLevel: 1.08 }
    spirit:
        costs: [24, 48, 80, 118, 168]
        effects:
            - { stat: sp, mode: mul, perLevel: 1.15 }
            - { stat: spRegenMs, mode: mul, perLevel: 0.92 }
    luck:
        costs: [76, 152, 248, 384]
        effects:
            - { stat: luck, mode: add, perLevel: 1 }
stats:
    # Display-only radar values for the tavern select card (1-10).
    strength: 4
    agility: 6
    vitality: 7
    spirit: 8
skill:
    # Mascot Head (头套): press E to put the official mascot head on. It soaks
    # up the next few hits instead of her HP, then breaks and goes on cooldown
    # — measured from the break, not from the press.
    name: Mascot Head
    nameZh: "头套"
    kind: headgear
    absorbHits: 2
    cooldownMs: 30000
    tintColor: 0xFFE9A8
sfx:
    dodge: dodge
    hurtFemale: player-hurt-female
    throttleMs: 1200
    footstep: footstep
    footstepThrottleMs: 200
    lowHpHeartbeat: low-hp-heartbeat
    lowHpThreshold: 0.3
    lowHpPulseMs: 900
sprite:
    texture: assets/image/characters/seed.png
    grid:
        rows: 4
        cols: 4
    # Visual scale tracks `body` against deepseek's 26x26 → 1.35, so the
    # sprite and the physics box stay in proportion across the roster.
    scale: 1.45
    offset:
        left: -2
        bottom: -4
    # Provenance for `texture`: raws/seed.png is the 1536x1536 4x4 sheet the model
    # returned. It was de-watermarked, keyed at RGB distance 50, shrunk 2px, hole-
    # filled and quantised to 32 colours by tools/split-sheet-pale.py, with frames
    # bottom-aligned (sprite origin is (0.5, 1.0)).
    script:
        downsample: 3
        colors: 32
        pad: 2
anims:
    idle:
        frames:
            - 0
            - 3
        frameRate: 6
        repeat: -1
    walk:
        frames:
            - 4
            - 7
        frameRate: 10
        repeat: -1
    run:
        frames:
            - 8
            - 11
        frameRate: 12
        repeat: -1
    dodge:
        frames:
            - 12
            - 15
        frameRate: 14
        repeat: 0
