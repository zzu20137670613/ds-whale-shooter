# Gemini — the fifth seat. Replaced Seed on the owner's call: Seed's art never sat
# right beside the rest of the roster, Gemini does.
#
# Everything below is Seed's, unchanged: stats, the four ladders, dodge, SFX, the
# hotbar (frostmourne + assault-rifle). Only the plate and the skill moved, which is
# what "无缝替换" means here — the tavern seat, the spawn point and every animation
# behave exactly as before.
#
# Art: 4x4 sheet, keyed off a magenta field and re-gridded so each frame is centred
# (see tools notes in `key_gemini_art.py` at the workshop root).
id: gemini
name: Gemini
nameZh: "Gemini"
description: |
    A cat girl with nine lives, and she spends every one of them on standing still. She does not dodge - she waits until your arm is tired, then pads over, and that is when the fight starts.
descriptionZh: |
    猫娘，命九条，全花在站着不动上。别人打她她不闪，等对面气喘了，她才慢悠悠地靠近——那才是她开始打的时候。
imageSize: 2048x2048
hp: 100
armor: 0
spRegenPerSec: 0.5
sp: 200
luck: 2
moveSpeed: 5.0
spRegenMs: 2600
gender: female
body:
    halfW: 28
    halfH: 28
dodge:
    spCost: 12
    speed: 14
    durationMs: 220
    cooldownMs: 560
hotbar:
    - frostmourne
    - assault-rifle

weaponMax: 4
upgrades:
    # 五条梯子，级数 = costs.length；价格是角色之间的区分度，效果是全局规则。
    armor:
        # 护甲：固定减伤 -5/级，满级 -25。承伤 = max(0, 伤害 - 护甲)，不会回血。
        costs: [26, 52, 86, 126, 180]
        effects:
            - { stat: armor, mode: add, perLevel: 5 }
    agility:
        # 敏捷：移速绝对值 +0.3/级。
        costs: [48, 96, 156, 228, 324]
        effects:
            - { stat: moveSpeed, mode: add, perLevel: 0.3 }
    hp:
        # 血量：每级 +20 最大血量上限，满级 +100。
        costs: [35, 70, 115, 170, 240]
        effects:
            - { stat: hp, mode: add, perLevel: 20 }
    spirit:
        # 灵力：每级 +10 HP 上限、+10 SP 上限、+0.3 SP/秒。
        costs: [24, 48, 80, 118, 168]
        effects:
            - { stat: hp, mode: add, perLevel: 10 }
            - { stat: sp, mode: add, perLevel: 10 }
            - { stat: spRegenPerSec, mode: add, perLevel: 0.3 }
    luck:
        # 幸运：+1/级，5 级。幸运 10 = 100% 暴击（双倍伤害）。
        costs: [76, 152, 248, 384, 596]
        effects:
            - { stat: luck, mode: add, perLevel: 1 }
stats:
    # Display-only radar values for the tavern select card (1-10).
    strength: 4
    agility: 6
    vitality: 7
    spirit: 8
skill:
    # Nine Lives (九命猫): press E and the cat takes the damage instead of her.
    # A shield measured in HP, not in hits: 15 at level 0, +15 per upgrade level,
    # 90 at level 5. It soaks damage AFTER armour, so armour keeps working while
    # the shield is up, and it goes on cooldown when it BREAKS.
    name: Nine Lives
    nameZh: "九命猫"
    kind: nine-lives
    spCost: 180
    hpPerLevel: 15
    cooldownMs: 30000
    tintColor: 0xC9A8FF
sfx:
    dodge: dodge
    hurtFemale: player-hurt-female
    throttleMs: 1200
    footstep: footstep
    footstepThrottleMs: 200
    lowHpHeartbeat: low-hp-heartbeat
    lowHpThreshold: 0.3
    lowHpPulseMs: 900
sprite:
    texture: assets/image/characters/gemini/gemini.png
    grid:
        rows: 4
        cols: 4
    # Same proportion rule as the rest of the roster: the drawn body sits at
    # ~1.45x her 28x28 physics box.
    scale: 1.3516
    offset:
        left: -2
        bottom: -4
anims:
    idle:
        # Static, on purpose. The four idle frames were generated separately, so they are
        # near-identical poses a few pixels apart - looping them read as a twitch, worst on
        # the pale characters. Walking, running and dodging still animate.
        frames:
            - 0
            - 0
        frameRate: 1
        repeat: -1

    walk:
        frames:
            - 4
            - 7
        frameRate: 10
        repeat: -1
    # ── run: OFF (2026-11-09) ───────────────────────────────
    # 奔跑动作五个角色没一个合格，主人决定先不播。美术重画后把下面的
    # 注释去掉、并恢复 logic.ts 里 driveAnims 的 sprint 分支即可。
    # run:
    #        frames:
    #            - 8
    #            - 11
    #        frameRate: 12
    #        repeat: -1
    dodge:
        frames:
            - 12
            - 15
        frameRate: 20
        repeat: 0
