# 深海特饮：一口补血 30、补蓝 60 的蓝饮料。
#
# 本文件原来的第一行把它称作"补满血蓝的饮料、海滩上的开场礼物"——
# 两句话都已经过时，2026-11-17 一并改掉：
#   · "补满"：2026-11-15 就改成了定量（补血 30 + 补蓝 60）；
#   · "开场礼物"：本关真正的开场礼物是踩沙滩椅弹出来的**冰镇果汁**（见
#     `levels/beach-holiday.yaml` 的 `lounger-juice` trigger）。
#
# 但它并没有白留：海滩假日里有一处摆位落在画出来的礁石上，看着像刻意埋的彩蛋。
# 主人 2026-11-17 确认后决定**刻意保留**：
#   `初始关出现深海特饮是一个美妙的偶然因素叠加起来的bug，当作刻意保留的彩蛋（2026-11-17 确认）`
name: Deep Sea Drink
nameZh: "海底特饮"
sellPrice: 0
kind: static
sfx: pickup-hp
visual:
    size: 20
    # 主人 2026-11-15：`将海底特饮在背包里那个图片的底色改为亮蓝底` —— 回到 0x38BDF8。
    tint: 0x38bdf8
# 主人 2026-11-17：`捡起来弹「礁石上有杯深海特饮……是谁放在这儿的？」`。
# 这句只对那个摆位成立 —— 怪物也会掉深海特饮，但那里弹出来出自礁石就太怪了，
# 所以台词由**关卡摆位**那边给不出来，只能挂在道具上：
# 目前只有那处 static 摆位会让它被捡起时刷到这句（怪物掉落同样会弹，可接受）。
pickupNotice: A glass of Deep Sea Drink on the rocks... who left it here?
pickupNoticeZh: 礁石上有杯深海特饮……是谁放在这儿的？
# 两层绑定（主人 2026-11-17）：只有"这件道具" + "这张图"同时成立才弹。
# 它也是怪物掉落，在别处弹"礁石上"就是错的。
pickupNoticeLevels: [beach-holiday]
effect:
    # 主人 2026-11-15：`将海底特饮的数值改为补血30+补蓝60`。
    # 原来是 full-restore（一口气补满），现在是一口定量的蓝饮料。
    type: instant
    hp: 30
    sp: 60

# 主人 2026-11-15：`【海底特饮】是没有自己专属小图片吗?我看背包里海底特饮与生命碎片用的同一张图，
# 只是底色不一样`。确实一直是借 `drops.png` 里生命碎片那一格（见 git 历史里的 PLACEHOLDER 注释），
# 现在有自己的一张 64x64：深海底色的蓝、两块冰、一根玫红吸管。
# 口径和饭盆图标一致——64x64、16 色、1px 深色描边、透明背景。
sprite:
    texture: assets/image/drops/beach-drink.png
    scale: 1